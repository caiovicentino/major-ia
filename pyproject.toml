[project]
name = "major-ia"
version = "0.1.0"
description = "Assistente de voz para macOS com o Claude Code: fale pelo teclado ou por um anel inteligente SR116 e ouça a resposta"
readme = "README.md"
requires-python = ">=3.11"
# O essencial serve para o modo sem anel. O anel e a voz Kokoro são extras:
#   uv sync --extra anel      uv sync --extra kokoro
dependencies = [
    "pocket-tts>=4.0",
    "num2words>=0.5",
    "sounddevice>=0.5",
    "numpy>=2",
    "scipy>=1.14",
]

[project.optional-dependencies]
anel = [
    "bleak>=3.1",
    "hidapi>=0.14",
]
# A voz Kokoro também precisa do espeak-ng do Homebrew (brew install espeak-ng). Atenção à licença: o
# phonemizer-fork e o espeak-ng são GPL versão 3; por isso ficam fora da instalação padrão.
kokoro = [
    "mlx-audio>=0.6.5",
    "misaki>=0.9.4",
    "phonemizer-fork>=3.3.2",
    "espeakng-loader>=0.2.4",
]

[project.scripts]
major = "major.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["major"]
